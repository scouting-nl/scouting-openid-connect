name: 'deploy-wordpress-svn'

on:
  push:
    tags:
      - '*.*.*'

permissions: {}

concurrency:
  group: deploy-wordpress-svn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare WordPress.org assets
        run: |
          mkdir .wordpress-org
          cp -R assets/. .wordpress-org/
          find assets -type f ! -name '*.svg' -delete

      - name: Deploy to WordPress.org SVN
        uses: nk-o/action-wordpress-plugin-deploy@da321e756321e0659ec59c27bb3369a00c8eb117 # v0.0.5
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: scouting-openid-connect
          ASSETS_DIR: .wordpress-org