name: 'release-zip'

on:
  push:
    tags:
      - '*.*.*'

permissions: {}

jobs:
  package:
    name: Plugin ZIP
    permissions:
      contents: read
    uses: ./.github/workflows/package-plugin.yml
    with:
      version: ${{ github.ref_name }}

  release:
    name: Publish plugin release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin ZIP
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: ${{ runner.temp }}/plugin-artifact

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ZIP_PATH: ${{ runner.temp }}/plugin-artifact/${{ needs.package.outputs.zip-name }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --json id >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ZIP_PATH}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${ZIP_PATH}" --generate-notes --verify-tag
          fi
