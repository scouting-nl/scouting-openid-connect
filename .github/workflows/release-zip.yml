name: 'release-zip'

on:
  push:
    tags:
      - '*.*.*'

permissions: {}

jobs:
  package:
    name: Build plugin zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build zip archive
        run: |
          set -euo pipefail
          PLUGIN_SLUG="scouting-openid-connect"
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_ROOT="${RUNNER_TEMP}/build"
          STAGING="${BUILD_ROOT}/${PLUGIN_SLUG}"

          mkdir -p "${STAGING}"
          rsync -av . "${STAGING}" \
            --exclude ".config" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".vscode" \
            --exclude ".distignore" \
            --exclude ".editorconfig" \
            --exclude ".gitattributes" \
            --exclude "CHANGELOG.md" \
            --exclude "README.md" \
            --include "assets/" \
            --include "assets/icon.svg" \
            --exclude "assets/*"

          cd "${BUILD_ROOT}"
          ZIP_NAME="${PLUGIN_SLUG}.${VERSION}.zip"
          zip -r "${ZIP_NAME}" "${PLUGIN_SLUG}"
          echo "ZIP_PATH=${BUILD_ROOT}/${ZIP_NAME}" >> "${GITHUB_ENV}"
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: Upload zip as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" --json id >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ZIP_PATH}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ZIP_PATH}" --generate-notes --verify-tag
          fi
