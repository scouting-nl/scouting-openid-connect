version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "jobvk"
      - "copilot"
    assignees:
      - "jobvk"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
